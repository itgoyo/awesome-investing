<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资 · 金融 · Web3 学习资料库</title>
<script src="data/catalog.js"></script>
<style>
  :root {
    --bg: #0b0e12; --bg-soft: #11161d; --card: #141a22; --card-hover: #19212b;
    --line: #232c38; --fg: #e7edf5; --dim: #98a4b5; --faint: #6b7686;
    --accent: #e0b155; --accent-soft: rgba(224,177,85,.12); --ok: #4ec9a0;
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  header.top { position: sticky; top: 0; z-index: 20; background: rgba(11,14,18,.94);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 18px 0 14px; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  h1 { font-size: 21px; margin: 0 0 4px; font-weight: 650; letter-spacing: .2px; }
  .sub { margin: 0; color: var(--dim); font-size: 13px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
  .lang button { background: transparent; border: 0; color: var(--dim); padding: 6px 14px;
    font-size: 13px; cursor: pointer; font-family: inherit; }
  .lang button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .stats { display: flex; flex-wrap: wrap; gap: 20px; margin: 14px 0 12px; }
  .stat { font-size: 13px; color: var(--dim); }
  .stat b { color: var(--fg); font-variant-numeric: tabular-nums; font-size: 15px; margin-right: 3px; }

  #q { width: 100%; background: var(--bg-soft); border: 1px solid var(--line); color: var(--fg);
    border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; }
  #q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #q::placeholder { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: var(--bg-soft); border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .chip:hover { color: var(--fg); border-color: #33404f; }
  .chip.on { background: var(--accent-soft); border-color: rgba(224,177,85,.5); color: var(--accent); }

  main { padding: 30px 0 10px; }
  section { margin-bottom: 46px; scroll-margin-top: 190px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  h2 { font-size: 16px; margin: 0; font-weight: 620; letter-spacing: .3px; }
  .sec-note { color: var(--faint); font-size: 12.5px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 6px;
    transition: background .15s, border-color .15s; }
  .card:hover { background: var(--card-hover); border-color: #2f3a49; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .badge { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(224,177,85,.25); }
  .src { font-family: var(--mono); font-size: 11px; color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card h3 { font-size: 15.5px; margin: 2px 0 0; font-weight: 620; line-height: 1.4; }
  .author { margin: 0; color: var(--dim); font-size: 12.5px; }
  .note { margin: 2px 0 0; color: var(--faint); font-size: 12px; line-height: 1.55; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
  .tag { font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
  .dl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 11px; border-top: 1px dashed var(--line); }
  .dl a { display: inline-flex; align-items: baseline; gap: 6px; background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font-size: 12.5px; color: var(--fg); }
  .dl a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .dl .fmt { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .dl .size { font-variant-numeric: tabular-nums; color: var(--faint); font-size: 11px; }
  .dl a:hover .fmt, .dl a:hover .size { color: inherit; }

  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--dim); background: var(--bg-soft); letter-spacing: .3px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--card-hover); }
  .rank { color: var(--faint); font-variant-numeric: tabular-nums; width: 34px; }
  .repo { font-family: var(--mono); font-size: 12.5px; color: var(--fg); overflow-wrap: anywhere; }
  .stars { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent); width: 76px; }
  .kinds { white-space: nowrap; color: var(--dim); font-size: 12px; width: 108px; }
  .desc { color: var(--dim); font-size: 12.5px; line-height: 1.55; }
  .flag { font-size: 11px; padding: 1px 7px; border-radius: 5px; margin-left: 6px; white-space: nowrap;
    color: var(--ok); background: rgba(78,201,160,.1); border: 1px solid rgba(78,201,160,.28); }

  .notes { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; }
  .notes h3 { font-size: 13.5px; margin: 0 0 8px; color: var(--fg); font-weight: 620; }
  .notes p, .notes li { color: var(--dim); font-size: 13px; line-height: 1.7; margin: 6px 0; }
  .notes ul { margin: 6px 0 14px; padding-left: 20px; }
  .notes code { font-family: var(--mono); font-size: 12px; background: var(--bg-soft); padding: 1px 6px; border-radius: 5px; color: var(--accent); }
  footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--faint); font-size: 12px; }
  .empty { color: var(--faint); font-size: 13.5px; padding: 20px 0; }
  @media (max-width: 720px) {
    .wrap { padding: 0 16px; }
    .head-row { flex-direction: column; gap: 10px; }
    .kinds, th:nth-child(4), td:nth-child(4) { display: none; }
    .desc { font-size: 12px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="head-row">
      <div>
        <h1 id="h-title"></h1>
        <p class="sub" id="h-sub"></p>
      </div>
      <div class="lang" role="group" aria-label="language">
        <button data-lang="zh">中文</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
    <div class="stats" id="h-stats"></div>
    <input id="q" type="search" autocomplete="off" spellcheck="false">
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap">
  <section id="library">
    <div class="sec-head">
      <h2 id="lib-title"></h2>
      <span class="sec-note" id="lib-note"></span>
    </div>
    <div class="grid" id="books"></div>
  </section>

  <section id="repos">
    <div class="sec-head">
      <h2 id="repo-title"></h2>
      <span class="sec-note" id="repo-note"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="repos-body"></tbody>
      </table>
    </div>
  </section>

  <section id="about">
    <div class="sec-head"><h2 id="about-title"></h2></div>
    <div class="notes" id="about-body"></div>
  </section>
</main>

<footer class="wrap"><p id="foot"></p></footer>

<script>
(function () {
  "use strict";
  var C = window.CATALOG;
  var T = {
    zh: {
      title: "投资 · 金融 · Web3 学习资料库",
      sub: "只收资料汇总型仓库：清单、书单、论文索引、开源书、课程大纲。不收策略、机器人、交易软件。",
      stats: ["个仓库", "个分类", "本电子书", "个文件", "MB"],
      search: "搜索仓库名、书名、作者、标签…（按 / 聚焦）",
      all: "全部",
      libTitle: "本地书库",
      repoTitle: "Top 30 仓库榜单",
      repoNote: "按 Star 从高到低",
      libNote: "点格式按钮直接下载",
      cols: ["#", "仓库", "Star", "分类", "最后更新", "说明"],
      aboutTitle: "这份名单怎么来的",
      foot: "资料来自各仓库原作者，版权归原作者所有。本页仅做索引与本地归档，不构成投资建议。",
      empty: "没有匹配的结果，换个关键词试试。",
      localTag: "含本地文件",
      checked: "核验日期",
      about: [
        "30 个仓库在 " + C.checked_at + " 逐个调用 GitHub API 核验：仓库存在、未归档、README 可访问、最近一次提交在三年内。星数取 API 实时值，不是抄来的。",
        "筛选标准是「资料汇总」而不是「能跑的东西」。清单、书单、论文索引、白皮书归档、开源书、课程大纲收；策略代码、交易机器人、行情终端、记账软件、量化框架一律剔除。这条规则剔掉了 star 更高的 FinRL、quant-trading、machine-learning-for-trading 等项目。",
        "另外剔除了几个看着像但实为别的主题的仓库：<code>neutraltone/awesome-stock-resources</code> 是免费图库，<code>awesome-cryptography</code> 与 <code>awesome-quantum-computing</code> 是密码学和量子计算，都和投资无关。",
        "有 4 个仓库最后更新在 2024 年（chaozh、smartcontractkit、FrancescoXX、imbaniac），内容仍然有效但没有新条目，榜单里照实标了更新时间。已归档的 <code>mr-karan/awesome-investing</code> 虽然经典，按「不废弃」的要求没有收录。",
        "书库里的 PDF 来自两个仓库：<code>codeman008/Financial_freedom</code> 的 17 本中文经典，<code>xiaolai/regular-investing-in-box</code> 的中英双语《定投改变命运》。本地副本仅供个人学习，请支持正版。",
      ],
    },
    en: {
      title: "Investing · Finance · Web3 Learning Library",
      sub: "Aggregation repos only: lists, booklists, paper indexes, open books, course outlines. No strategies, bots or trading software.",
      stats: ["repos", "categories", "ebooks", "files", "MB"],
      search: "Search repo, title, author, tag… (press / to focus)",
      all: "All",
      libTitle: "Local library",
      repoTitle: "Top 30 repositories",
      repoNote: "sorted by stars",
      libNote: "click a format to download",
      cols: ["#", "Repository", "Stars", "Type", "Last push", "What it is"],
      aboutTitle: "How this list was built",
      foot: "Material belongs to the original authors. This page is an index and local archive. Not investment advice.",
      empty: "Nothing matches. Try another keyword.",
      localTag: "local files",
      checked: "verified",
      about: [
        "Every one of the 30 repos was checked against the GitHub API on " + C.checked_at + ": exists, not archived, README reachable, last push within three years. Star counts are live values, not copied.",
        "The filter is learning material, not runnable software. Lists, booklists, paper indexes, whitepaper archives, open books and course outlines are in. Strategy code, trading bots, market terminals, budgeting apps and quant frameworks are out. That rule dropped higher-starred repos such as FinRL, quant-trading and machine-learning-for-trading.",
        "Three lookalikes were dropped for being a different subject: <code>neutraltone/awesome-stock-resources</code> is stock photography, <code>awesome-cryptography</code> and <code>awesome-quantum-computing</code> are cryptography and quantum computing.",
        "Four repos last updated in 2024 (chaozh, smartcontractkit, FrancescoXX, imbaniac). Content still holds, no new entries; the table shows the real date. The archived <code>mr-karan/awesome-investing</code> is a classic but fails the not-abandoned rule, so it is out.",
        "The PDFs come from two repos: 17 Chinese classics in <code>codeman008/Financial_freedom</code> and the bilingual <em>On Regular Investing</em> in <code>xiaolai/regular-investing-in-box</code>. Local copies are for personal study; buy the books.",
      ],
    },
  };

  var param = new URLSearchParams(location.search).get("lang");
  var CAT_EN = {
    "定投": "DCA", "价值投资": "Value investing", "财报分析": "Statements",
    "指数基金": "Index funds", "资产配置": "Asset allocation", "市场史": "Market history",
    "投资心理": "Psychology", "理财入门": "Money basics",
  };

  var state = {
    lang: param ? (param === "en" ? "en" : "zh") : (localStorage.getItem("ai-lang") === "en" ? "en" : "zh"),
    q: "",
    cat: "all",
  };

  var el = {
    title: document.getElementById("h-title"),
    sub: document.getElementById("h-sub"),
    stats: document.getElementById("h-stats"),
    q: document.getElementById("q"),
    chips: document.getElementById("chips"),
    libTitle: document.getElementById("lib-title"),
    libNote: document.getElementById("lib-note"),
    books: document.getElementById("books"),
    repoTitle: document.getElementById("repo-title"),
    repoNote: document.getElementById("repo-note"),
    thead: document.getElementById("thead"),
    body: document.getElementById("repos-body"),
    aboutTitle: document.getElementById("about-title"),
    aboutBody: document.getElementById("about-body"),
    foot: document.getElementById("foot"),
  };

  function t() { return T[state.lang]; }
  function fmtStars(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n); }
  function fmtBytes(b) {
    if (!b) return "0";
    if (b >= 1e9) return (b / 1e9).toFixed(2) + " GB";
    if (b >= 1e6) return (b / 1e6).toFixed(1) + " MB";
    return Math.round(b / 1e3) + " KB";
  }
  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function matches(haystack) {
    if (!state.q) return true;
    return haystack.join(" ").toLowerCase().indexOf(state.q) !== -1;
  }

  function renderHead() {
    var s = C.stats;
    el.title.textContent = t().title;
    el.sub.textContent = t().sub;
    el.q.placeholder = t().search;
    el.stats.textContent = "";
    var pairs = [
      [s.repos, t().stats[0]],
      [s.categories, t().stats[1]],
      [s.titles, t().stats[2]],
      [s.files, t().stats[3]],
      [fmtBytes(s.bytes), ""],
    ];
    pairs.forEach(function (p) {
      var box = node("span", "stat");
      box.appendChild(node("b", "", String(p[0])));
      box.appendChild(document.createTextNode((state.lang === "en" ? " " : "") + p[1]));
      el.stats.appendChild(box);
    });
  }

  function renderChips() {
    el.chips.textContent = "";
    var items = [{ id: "all", zh: t().all, en: t().all }].concat(C.categories);
    items.forEach(function (c) {
      var b = node("button", "chip" + (state.cat === c.id ? " on" : ""), state.lang === "zh" ? c.zh : c.en);
      b.type = "button";
      b.onclick = function () { state.cat = c.id; render(); };
      el.chips.appendChild(b);
    });
  }

  function renderBooks() {
    el.libTitle.textContent = t().libTitle;
    el.libNote.textContent = C.stats.titles + " / " + fmtBytes(C.stats.bytes) + " · " + t().libNote;
    el.books.textContent = "";
    var list = C.books.filter(function (b) {
      return matches([b.zh, b.en, b.author, b.author_en, b.category, b.tags.join(" "), b.repo]);
    });
    if (!list.length) { el.books.appendChild(node("p", "empty", t().empty)); return; }
    list.forEach(function (b) {
      var card = node("article", "card");
      var top = node("div", "card-top");
      top.appendChild(node("span", "badge", state.lang === "en" ? (CAT_EN[b.category] || b.category) : b.category));
      top.appendChild(node("span", "src", b.repo));
      card.appendChild(top);
      card.appendChild(node("h3", "", state.lang === "zh" ? b.zh : b.en));
      card.appendChild(node("p", "author", state.lang === "zh" ? b.author : b.author_en));
      card.appendChild(node("p", "note", state.lang === "zh" ? b.edition_zh : b.edition_en));
      var tags = node("div", "tags");
      (state.lang === "en" ? (b.tags_en || b.tags) : b.tags).forEach(function (g) { tags.appendChild(node("span", "tag", g)); });
      card.appendChild(tags);
      var dl = node("div", "dl");
      b.files.forEach(function (f) {
        var a = document.createElement("a");
        a.href = encodeURI(f.path);
        a.setAttribute("download", "");
        a.appendChild(node("span", "fmt", state.lang === "en" ? f.label.replace("中文", "ZH") : f.label));
        a.appendChild(node("span", "size", fmtBytes(f.bytes)));
        dl.appendChild(a);
      });
      card.appendChild(dl);
      el.books.appendChild(card);
    });
  }

  function renderRepos() {
    el.repoTitle.textContent = t().repoTitle;
    el.repoNote.textContent = t().repoNote + " · " + t().checked + " " + C.checked_at;
    el.thead.textContent = "";
    t().cols.forEach(function (c) { el.thead.appendChild(node("th", "", c)); });

    el.body.textContent = "";
    var list = C.repos.filter(function (r) {
      if (state.cat !== "all" && r.category !== state.cat) return false;
      return matches([r.full_name, r.zh, r.en, r.tags.join(" ")]);
    });
    if (!list.length) {
      var tr = node("tr");
      var td = node("td", "empty", t().empty);
      td.colSpan = 6;
      tr.appendChild(td);
      el.body.appendChild(tr);
      return;
    }
    var catName = {};
    C.categories.forEach(function (c) { catName[c.id] = state.lang === "zh" ? c.zh : c.en; });
    list.forEach(function (r, i) {
      var tr = node("tr");
      tr.appendChild(node("td", "rank", String(i + 1)));
      var nameCell = node("td");
      var a = document.createElement("a");
      a.href = r.url; a.target = "_blank"; a.rel = "noopener";
      a.className = "repo"; a.textContent = r.full_name;
      nameCell.appendChild(a);
      if (r.local_books.length) nameCell.appendChild(node("span", "flag", t().localTag));
      tr.appendChild(nameCell);
      tr.appendChild(node("td", "stars", "★ " + fmtStars(r.stars)));
      tr.appendChild(node("td", "kinds", catName[r.category] || ""));
      tr.appendChild(node("td", "kinds", r.pushed_at));
      tr.appendChild(node("td", "desc", state.lang === "zh" ? r.zh : r.en));
      el.body.appendChild(tr);
    });
  }

  function renderAbout() {
    el.aboutTitle.textContent = t().aboutTitle;
    el.aboutBody.textContent = "";
    t().about.forEach(function (p) {
      var d = node("p");
      d.innerHTML = p;
      el.aboutBody.appendChild(d);
    });
    el.foot.textContent = t().foot;
  }

  function render() {
    document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.lang === state.lang);
    });
    renderHead();
    renderChips();
    renderBooks();
    renderRepos();
    renderAbout();
  }

  el.q.addEventListener("input", function (e) {
    state.q = e.target.value.trim().toLowerCase();
    renderBooks();
    renderRepos();
  });
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.lang = b.dataset.lang;
      localStorage.setItem("ai-lang", state.lang);
      render();
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== el.q) { e.preventDefault(); el.q.focus(); }
  });

  render();
})();
</script>
</body>
</html>
