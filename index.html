<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资学习手册 · An Investing Handbook</title>
<script src="data/site.js"></script>
<style>
  :root {
    --bg: #0b0e12; --bg-soft: #11161d; --card: #141a22; --card-hover: #19212b;
    --line: #232c38; --fg: #e7edf5; --dim: #98a4b5; --faint: #6b7686;
    --accent: #e0b155; --accent-soft: rgba(224,177,85,.12); --ok: #4ec9a0;
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.72 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; }

  header.top { position: sticky; top: 0; z-index: 30; background: rgba(11,14,18,.94);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .head { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand b { font-size: 15px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
  .brand span { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .search { flex: 1; max-width: 340px; margin-left: auto; }
  #q { width: 100%; background: var(--bg-soft); border: 1px solid var(--line); color: var(--fg);
    border-radius: 9px; padding: 7px 12px; font-size: 13px; font-family: inherit; }
  #q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #q::placeholder { color: var(--faint); }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
  .lang button { background: transparent; border: 0; color: var(--dim); padding: 5px 12px;
    font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .lang button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .shell { max-width: 1240px; margin: 0 auto; padding: 0 24px; display: grid;
    grid-template-columns: 236px minmax(0, 1fr); gap: 44px; align-items: start; }
  nav { position: sticky; top: 62px; padding: 26px 0 60px; max-height: calc(100vh - 62px); overflow-y: auto; overflow-x: hidden; }
  nav .group { font-size: 11px; letter-spacing: .12em; color: var(--faint);
    text-transform: uppercase; margin: 0 0 8px 10px; }
  nav a { display: flex; gap: 9px; align-items: baseline; padding: 7px 10px; border-radius: 8px;
    color: var(--dim); font-size: 13.5px; line-height: 1.45; text-decoration: none; }
  nav a:hover { background: var(--bg-soft); color: var(--fg); text-decoration: none; }
  nav a.on { background: var(--accent-soft); color: var(--accent); }
  nav a i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--faint); flex: none; }
  nav a.on i { color: var(--accent); }
  nav .sep { height: 1px; background: var(--line); margin: 14px 10px; }
  nav .hits { font-size: 11.5px; color: var(--faint); margin: 8px 10px 0; }

  main { padding: 30px 0 90px; min-width: 0; }
  article { max-width: 720px; }
  .kicker { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; margin: 0; }
  article h1 { font-size: 27px; line-height: 1.35; margin: 8px 0 6px; font-weight: 660; letter-spacing: .2px; }
  .lede { color: var(--dim); font-size: 14px; margin: 0 0 26px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .prose h2 { font-size: 17px; margin: 34px 0 10px; font-weight: 640; letter-spacing: .2px; }
  .prose h3 { font-size: 15px; margin: 24px 0 8px; font-weight: 620; color: var(--fg); }
  .prose p { margin: 0 0 14px; color: #cfd8e4; }
  .prose ul, .prose ol { margin: 0 0 16px; padding-left: 22px; color: #cfd8e4; }
  .prose li { margin: 0 0 7px; }
  .prose strong { color: var(--fg); font-weight: 640; }
  .prose code { font-family: var(--mono); font-size: 12.5px; background: var(--bg-soft);
    padding: 1px 6px; border-radius: 5px; color: var(--accent); }
  .prose blockquote { margin: 0 0 16px; padding: 8px 16px; border-left: 2px solid var(--accent);
    background: var(--accent-soft); color: #d8c9a8; border-radius: 0 8px 8px 0; }

  .related { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); }
  .related h4 { font-size: 12px; letter-spacing: .1em; color: var(--faint);
    text-transform: uppercase; margin: 0 0 12px; font-weight: 600; }
  .rel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .rel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .rel b { display: block; font-size: 13.5px; font-weight: 620; margin-bottom: 2px; }
  .rel span { display: block; font-size: 12px; color: var(--faint); margin-bottom: 8px; }
  .dl { display: flex; flex-wrap: wrap; gap: 6px; }
  .dl a { font-size: 11.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 8px; text-decoration: none; background: var(--bg-soft); font-family: var(--mono); }
  .dl a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 44px; }
  .pager a { font-size: 13px; color: var(--dim); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 14px; text-decoration: none; max-width: 48%; }
  .pager a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
  .pager a.next { margin-left: auto; text-align: right; }
  .pager span { display: block; font-size: 11px; color: var(--faint); }

  h2.page { font-size: 24px; margin: 4px 0 6px; font-weight: 660; }
  .page-sub { color: var(--dim); font-size: 14px; margin: 0 0 26px; }

  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
  .book { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px 13px; display: flex; flex-direction: column; }
  .book:hover { background: var(--card-hover); }
  .book .cat { font-size: 11px; color: var(--accent); border: 1px solid rgba(224,177,85,.25);
    background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; align-self: flex-start; }
  .book h3 { font-size: 15px; margin: 9px 0 2px; font-weight: 630; line-height: 1.4; }
  .book .who { font-size: 12px; color: var(--faint); margin: 0 0 8px; }
  .book .why { font-size: 12.5px; color: #aab6c6; margin: 0 0 12px; line-height: 1.6; }
  .book .dl { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); }
  .empty { color: var(--faint); font-size: 13.5px; padding: 20px 0; }

  .notes { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px 24px; max-width: 720px; }
  .notes p, .notes li { color: #cfd8e4; font-size: 13.5px; line-height: 1.75; }
  .notes h3 { font-size: 14px; margin: 18px 0 6px; }
  .notes h3:first-child { margin-top: 0; }
  .notes ul { padding-left: 20px; margin: 6px 0; }

  footer { border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; }
  footer .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 24px 40px; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; gap: 0; }
    nav { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto;
      padding: 12px 0; border-bottom: 1px solid var(--line); }
    nav .group, nav .sep, nav .hits { display: none; }
    nav a { white-space: nowrap; background: var(--bg-soft); border: 1px solid var(--line); }
    nav a i { display: none; }
    main { padding-top: 22px; }
    .head { flex-wrap: wrap; gap: 10px; }
    .search { order: 3; max-width: none; flex-basis: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="head">
    <div class="brand">
      <b id="brand"></b>
      <span id="tagline"></span>
    </div>
    <div class="search"><input id="q" type="search" autocomplete="off" spellcheck="false"></div>
    <div class="lang" role="group" aria-label="language">
      <button data-lang="zh">中文</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<footer><div class="wrap" id="foot"></div></footer>

<script>
(function () {
  "use strict";
  var S = window.SITE;
  var T = {
    zh: {
      brand: "投资学习手册",
      tagline: "八章判断框架 · " + S.stats.titles + " 本本地藏书",
      search: "搜索章节、书名、关键词…（按 / 聚焦）",
      chapters: "章节", shelf: "书库", about: "关于", app: "附录",
      books: "本地书库",
      booksSub: "共 " + S.stats.titles + " 本，" + S.stats.files + " 个文件。点格式直接下载，离线可读。",
      aboutTitle: "这份手册的来历与取舍",
      related: "本章相关读物",
      prev: "上一章", next: "下一章",
      hits: "个匹配章节",
      empty: "没有匹配的内容，换个关键词。",
      foot: "内容为学习框架，不构成投资建议。书籍版权归原作者与出版方所有。"
    },
    en: {
      brand: "An Investing Handbook",
      tagline: "Eight chapters · " + S.stats.titles + " books on the shelf",
      search: "Search chapters, titles, keywords… (press /)",
      chapters: "Chapters", shelf: "Library", about: "About", app: "Appendix",
      books: "Local library",
      booksSub: S.stats.titles + " titles, " + S.stats.files + " files. Click a format to download; works offline.",
      aboutTitle: "Where this came from, and what it leaves out",
      related: "Reading for this chapter",
      prev: "Previous", next: "Next",
      hits: "matching chapters",
      empty: "Nothing matches. Try another keyword.",
      foot: "Learning framework only, not investment advice. Book copyright belongs to the original authors and publishers."
    }
  };

  var CAT_EN = {
    "定投": "DCA", "价值投资": "Value", "财报分析": "Statements", "指数基金": "Index",
    "资产配置": "Allocation", "市场史": "History", "投资心理": "Psychology", "理财入门": "Basics"
  };

  var param = new URLSearchParams(location.search).get("lang");
  var state = {
    lang: param ? (param === "en" ? "en" : "zh") : (localStorage.getItem("hb-lang") === "en" ? "en" : "zh"),
    view: (location.hash || "#ch/01-foundation").slice(1),
    q: ""
  };

  var el = {
    brand: document.getElementById("brand"),
    tagline: document.getElementById("tagline"),
    q: document.getElementById("q"),
    nav: document.getElementById("nav"),
    main: document.getElementById("main"),
    foot: document.getElementById("foot")
  };

  function t() { return T[state.lang]; }
  function zh() { return state.lang === "zh"; }
  function title(o) { return zh() ? o.zh : o.en; }
  function sum(o) { return zh() ? o.zh_sum : o.en_sum; }
  function who(b) { return zh() ? b.author : b.author_en; }
  function note(b) { return zh() ? b.note_zh : b.note_en; }
  function fmtBytes(b) {
    if (b >= 1e9) return (b / 1e9).toFixed(2) + " GB";
    if (b >= 1e6) return (b / 1e6).toFixed(1) + " MB";
    return Math.round(b / 1e3) + " KB";
  }
  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function strip(s) { return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " "); }

  function renderNav() {
    var q = state.q;
    el.nav.textContent = "";
    el.nav.appendChild(node("p", "group", t().chapters));
    var shown = 0;
    S.chapters.forEach(function (c) {
      var body = strip(zh() ? c.zh_html : c.en_html).toLowerCase();
      var hit = !q || title(c).toLowerCase().indexOf(q) !== -1 || body.indexOf(q) !== -1;
      if (!hit) return;
      shown++;
      var a = document.createElement("a");
      a.href = "#ch/" + c.id;
      if (state.view === "ch/" + c.id) a.className = "on";
      a.appendChild(node("i", "", c.num));
      a.appendChild(node("span", "", title(c)));
      el.nav.appendChild(a);
    });
    if (q) el.nav.appendChild(node("p", "hits", shown + " " + t().hits));
    el.nav.appendChild(node("div", "sep"));
    el.nav.appendChild(node("p", "group", t().app));
    [["books", t().books], ["about", t().about]].forEach(function (p) {
      var a = document.createElement("a");
      a.href = "#" + p[0];
      if (state.view === p[0]) a.className = "on";
      a.appendChild(node("span", "", p[1]));
      el.nav.appendChild(a);
    });
  }

  function dlRow(files) {
    var dl = node("div", "dl");
    files.forEach(function (f) {
      var a = document.createElement("a");
      a.href = encodeURI(f.path);
      a.setAttribute("download", "");
      a.textContent = f.label.replace("中文", "ZH") + " " + fmtBytes(f.bytes);
      dl.appendChild(a);
    });
    return dl;
  }

  function renderChapter(c) {
    var art = node("article");
    art.appendChild(node("p", "kicker", zh() ? "第 " + c.num + " 章" : "Chapter " + c.num));
    art.appendChild(node("h1", "", title(c)));
    art.appendChild(node("p", "lede", sum(c)));
    var prose = node("div", "prose");
    prose.innerHTML = zh() ? c.zh_html : c.en_html;
    art.appendChild(prose);

    if (c.related.length) {
      var rel = node("div", "related");
      rel.appendChild(node("h4", "", t().related));
      var grid = node("div", "rel-grid");
      c.related.forEach(function (b) {
        var card = node("div", "rel");
        card.appendChild(node("b", "", title(b)));
        card.appendChild(node("span", "", who(b)));
        card.appendChild(dlRow(b.files));
        grid.appendChild(card);
      });
      rel.appendChild(grid);
      art.appendChild(rel);
    }

    var idx = S.chapters.indexOf(c);
    var pager = node("div", "pager");
    if (idx > 0) {
      var p = S.chapters[idx - 1];
      var pa = document.createElement("a");
      pa.href = "#ch/" + p.id;
      pa.appendChild(node("span", "", t().prev));
      pa.appendChild(document.createTextNode(title(p)));
      pager.appendChild(pa);
    }
    if (idx < S.chapters.length - 1) {
      var n2 = S.chapters[idx + 1];
      var na = document.createElement("a");
      na.href = "#ch/" + n2.id;
      na.className = "next";
      na.appendChild(node("span", "", t().next));
      na.appendChild(document.createTextNode(title(n2)));
      pager.appendChild(na);
    }
    art.appendChild(pager);
    el.main.textContent = "";
    el.main.appendChild(art);
  }

  function renderBooks() {
    el.main.textContent = "";
    el.main.appendChild(node("h2", "page", t().books));
    el.main.appendChild(node("p", "page-sub", t().booksSub));

    var list = S.books.filter(function (b) {
      if (!state.q) return true;
      return [b.zh, b.en, b.author, b.author_en, b.category, b.note_zh, b.note_en]
        .join(" ").toLowerCase().indexOf(state.q) !== -1;
    });
    if (!list.length) { el.main.appendChild(node("p", "empty", t().empty)); return; }
    var shelf = node("div", "shelf");
    list.forEach(function (b) {
      var card = node("div", "book");
      card.appendChild(node("span", "cat", zh() ? b.category : (CAT_EN[b.category] || b.category)));
      card.appendChild(node("h3", "", title(b)));
      card.appendChild(node("p", "who", who(b)));
      card.appendChild(node("p", "why", note(b)));
      card.appendChild(dlRow(b.files));
      shelf.appendChild(card);
    });
    el.main.appendChild(shelf);
  }

  var ABOUT_ZH = [
    "<h3>为什么是这一份</h3>",
    "<p>开源社区里关于投资的资料极多，问题是筛选成本比阅读成本更高。这本手册的目标不是把资料收集全，而是把能用的判断标准留下来。</p>",
    "<h3>怎么取精华</h3>",
    "<ul><li>只看机制，不看结论。机制可以验证，结论往往绑定作者的年代和市场。</li>",
    "<li>同一件事至少两个来源对得上才收录，尤其是数字。</li>",
    "<li>凡是讲不清收益来源的，无论包装多专业，一律不进正文。</li></ul>",
    "<h3>怎么去糟粕</h3>",
    "<ul><li>删掉所有策略代码与交易信号。代码会过期，方法不会。</li>",
    "<li>删掉标的推荐。信息半衰期太短，写下来就是误导。</li>",
    "<li>删掉只讲心态不讲机制的励志段落。</li>",
    "<li>保留有局限的经典，但把局限写在书旁边，而不是只写推荐语。</li></ul>",
    "<h3>书库说明</h3>",
    "<p>书是原书副本，不是摘编。手册给判断，书给细节，两者不能互相替代。版权归原作者与出版方，请以购买正版支持。</p>",
    "<h3>边界</h3>",
    "<p>这不是投资建议，也不保证任何收益。它的用途是让你在听到一个说法时，有六个问题可以问回去。</p>"
  ].join("");

  var ABOUT_EN = [
    "<h3>Why this one</h3>",
    "<p>There is no shortage of investing material in the open-source world. The cost that matters is filtering, not reading. This handbook is not an attempt at completeness; it is an attempt to keep the standards that travel.</p>",
    "<h3>What was kept</h3>",
    "<ul><li>Mechanisms over conclusions. A mechanism can be checked; a conclusion is usually tied to one market and one decade.</li>",
    "<li>Nothing goes in unless two independent sources agree, especially numbers.</li>",
    "<li>Anything that cannot name where the return comes from stays out, however professional it looks.</li></ul>",
    "<h3>What was dropped</h3>",
    "<ul><li>All strategy code and trade signals. Code expires, method does not.</li>",
    "<li>All ticker calls. The half-life is too short; writing them down is misleading.</li>",
    "<li>Motivational paragraphs with no mechanism behind them.</li>",
    "<li>Nothing classic was removed for being imperfect. The limits sit next to the book instead of being hidden behind praise.</li></ul>",
    "<h3>About the shelf</h3>",
    "<p>The files are full copies, not excerpts. The handbook supplies judgment, the books supply detail; neither replaces the other. Copyright stays with the authors and publishers.</p>",
    "<h3>Boundaries</h3>",
    "<p>Not investment advice, no return guaranteed. Its use is to give you six questions the next time someone promises you a number.</p>"
  ].join("");

  function renderAbout() {
    el.main.textContent = "";
    el.main.appendChild(node("h2", "page", t().aboutTitle));
    var box = node("div", "notes");
    box.innerHTML = zh() ? ABOUT_ZH : ABOUT_EN;
    el.main.appendChild(box);
  }

  function render() {
    document.documentElement.lang = zh() ? "zh-CN" : "en";
    document.title = zh() ? "投资学习手册" : "An Investing Handbook";
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.lang === state.lang);
    });
    el.brand.textContent = t().brand;
    el.tagline.textContent = t().tagline;
    el.q.placeholder = t().search;
    el.foot.textContent = t().foot;

    renderNav();
    if (state.view === "books") renderBooks();
    else if (state.view === "about") renderAbout();
    else {
      var id = state.view.replace(/^ch\//, "");
      var c = S.chapters.filter(function (x) { return x.id === id; })[0] || S.chapters[0];
      renderChapter(c);
    }
    window.scrollTo(0, 0);
  }

  el.q.addEventListener("input", function (e) {
    state.q = e.target.value.trim().toLowerCase();
    renderNav();
    if (state.view === "books") renderBooks();
  });

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.lang = b.dataset.lang;
      localStorage.setItem("hb-lang", state.lang);
      render();
    });
  });

  window.addEventListener("hashchange", function () {
    state.view = (location.hash || "#ch/01-foundation").slice(1);
    render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== el.q) { e.preventDefault(); el.q.focus(); }
  });

  render();
})();
</script>
</body>
</html>
